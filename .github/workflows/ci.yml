name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ordinary CI never depends on NASA/JPL/LROC network availability: service
  # integrations are exercised against recorded fixtures (backend/horizons/testdata,
  # tests/golden). Optional live tests are opt-in (CHANDRA_LIVE_TESTS=1) and never
  # run here. The application, its tests and its deployment are Python-free.
  quality:
    name: Typecheck · build · unit · geometry · native backend · parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Node dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Unit tests (engine, ephemeris + Horizons validation, frames, sampling, energy, exports, catalogue, map)
        run: npm test
      - name: Geometry checks
        run: npm run test:geometry
      - name: Native backend (gofmt, vet, Go tests incl. Python-golden parity and Flask contract replay)
        run: npm run test:go
      - name: TypeScript / native Go horizon parity
        run: npm run test:parity
      - name: Vercel configuration (static checks)
        run: npm run vercel:check

  # Builds the real Vercel output with the official CLI (no credentials needed),
  # checks the generated routing table and EXECUTES the compiled Go function
  # through a local Lambda-runtime emulator. A live deployment is a separate,
  # credentialed step that this workflow never performs.
  vercel-build:
    name: Vercel build output (Go function executed locally)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: vercel build + route simulation + function execution
        run: node scripts/vercel-check.mjs --build

  # Real independent SPICE validation. v1.9: also runs on pull requests so every
  # PR carries a VISIBLE, required SPICE result (never skipped-as-passed). Kernels
  # come from checksummed public GitHub mirrors (not NASA), recorded in
  # data/kernels/PROVENANCE.json; the job FAILS if the fetch fails rather than
  # silently skipping. See docs/ci-governance.md for the required-check list.
  # This is the only job that uses Python: tools/spice-evidence is an isolated
  # evidence generator, not part of the application, its build or its deployment.
  spice-validation:
    name: Independent SPICE validation (fetched kernels)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install the isolated evidence tool (Python is used ONLY by this job)
        run: |
          python -m venv .venv-spice
          .venv-spice/bin/pip install --upgrade pip
          .venv-spice/bin/pip install -r tools/spice-evidence/requirements.txt
      - name: Fetch SPICE kernels (checksummed GitHub mirrors)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv-spice/bin/python tools/spice-evidence/fetch_spice_kernels.py
      - name: Verify kernels are present (fail rather than silently skip)
        run: |
          cd tools/spice-evidence && ../../.venv-spice/bin/python - <<'PY'
          import lunar_frame as lf
          assert lf.kernels_available(), "SPICE kernels missing — refusing to report a skipped validation as passed."
          print("SPICE kernels present; running the independent validation for real.")
          PY
      - name: Run kernel-gated SPICE frame tests
        run: .venv-spice/bin/python -m pytest tools/spice-evidence -q -rs

  # Browser E2E against a live dev server + native terrain API (no DEM configured, so the
  # real-mode no-DEM safeguard is exercised). Uses Playwright's portable Chromium.
  browser:
    name: Browser E2E (mission · terrain · space · onboarding · data hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start terrain API + dev console
        run: |
          npm run dev:full -- --api-port 8000 --web-port 5173 > /tmp/devfull.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ >/dev/null 2>&1 && curl -sf http://localhost:8000/api/config >/dev/null 2>&1; then
              echo "servers up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:5173/ >/dev/null || (echo "dev server failed"; cat /tmp/devfull.log; exit 1)
          curl -sf http://localhost:8000/api/config >/dev/null || (echo "terrain API failed"; cat /tmp/devfull.log; exit 1)
      - name: Responsive layout smoke (desktop, tablet and mobile)
        env:
          CHANDRA_BROWSER_CI: '1'
          BASE_URL: http://localhost:5173/
        run: npm run test:layout
      - name: Run browser E2E
        env:
          CHANDRA_BROWSER_CI: '1'
          BASE_URL: http://localhost:5173/
          # The CI runner has no GPU, so Chromium renders via SwiftShader: the
          # initial terrain-lab init (grid + shaders + 3D scene) takes longer than
          # the 30 s default patience. The default patience was previously the
          # operative contract for this step and is too tight; the browser-test
          # header documents CHANDRA_E2E_TIMEOUT_SCALE for software-rendered
          # browsers. SCALE=3 stretches every wait in this suite without changing
          # any assertion.
          CHANDRA_E2E_TIMEOUT_SCALE: '3'
        run: npm run test:browser
      - name: Run story tutorial E2E (personas A–E)
        env:
          CHANDRA_BROWSER_CI: '1'
          BASE_URL: http://localhost:5173/
        run: npm run test:story
      - name: Run scientific-export E2E (v1.11 personas A–E)
        env:
          CHANDRA_BROWSER_CI: '1'
          BASE_URL: http://localhost:5173/
        run: npm run test:exports
      # Self-contained: builds dist/, starts its own native API against loopback fixture servers
      # (recorded JPL Horizons responses, a range-capable synthetic COG) and intercepts the NASA
      # imagery hosts in the browser. No live NASA/JPL traffic.
      - name: Production build for the data-feature E2E
        run: npm run build
      - name: Run data-feature E2E (Polar Map orientation and layers, Data Hub, Horizons verification, LOLA acquisition)
        env:
          CHANDRA_BROWSER_CI: '1'
        run: npm run test:datahub
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: screenshots/
      - name: Upload dev-server log (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devfull-log
          path: /tmp/devfull.log
          if-no-files-found: warn
