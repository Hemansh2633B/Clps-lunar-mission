name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ordinary CI never depends on an external NASA download. SPICE-kernel-gated tests
  # are skipped here and reported as SKIPPED (never as a passed validation). The
  # separate spice-validation job runs them for real when kernels are fetched.
  quality:
    name: Typecheck · build · unit · geometry · parity · Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Unit tests (engine, ephemeris validation, frames, sampling, energy, exports, catalogue)
        run: npm test
      - name: Geometry checks
        run: npm run test:geometry
      - name: TypeScript / Python horizon parity
        run: npm run test:parity
      - name: Python tests (kernel-gated SPICE tests skip without kernels)
        run: .venv/bin/python -m pytest -q -rs
      - name: Report SPICE validation status honestly
        run: |
          .venv/bin/python - <<'PY'
          from backend import lunar_frame as lf
          available = lf.kernels_available()
          print(f"SPICE kernels available: {available}")
          if not available:
              print("Independent SPICE validation: SKIPPED in this job (kernels not fetched).")
              print("A skipped SPICE test is NOT a passed validation. See the spice-validation job.")
          else:
              print("SPICE kernels present; kernel-gated tests executed in the pytest step above.")
          PY

  # Real independent SPICE validation. v1.9: also runs on pull requests so every
  # PR carries a VISIBLE, required SPICE result (never skipped-as-passed). Kernels
  # come from checksummed public GitHub mirrors (not NASA), recorded in
  # data/kernels/PROVENANCE.json; the job FAILS if the fetch fails rather than
  # silently skipping. See docs/ci-governance.md for the required-check list.
  spice-validation:
    name: Independent SPICE validation (fetched kernels)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Python dependencies + spiceypy
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt spiceypy
      - name: Fetch SPICE kernels (checksummed GitHub mirrors)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/fetch-spice-kernels.py
      - name: Verify kernels are present (fail rather than silently skip)
        run: |
          .venv/bin/python - <<'PY'
          from backend import lunar_frame as lf
          assert lf.kernels_available(), "SPICE kernels missing — refusing to report a skipped validation as passed."
          print("SPICE kernels present; running the independent validation for real.")
          PY
      - name: Run kernel-gated SPICE frame tests
        run: .venv/bin/python -m pytest tests/python/test_lunar_frame.py -q -rs

  # Browser E2E against a live dev server + terrain API (no DEM configured, so the
  # real-mode no-DEM safeguard is exercised). Uses Playwright's portable Chromium.
  browser:
    name: Browser E2E (mission · terrain · space · onboarding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start terrain API + dev console
        run: |
          npm run dev:full -- --api-port 8000 --web-port 5173 > /tmp/devfull.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ >/dev/null 2>&1 && curl -sf http://localhost:8000/api/config >/dev/null 2>&1; then
              echo "servers up"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:5173/ >/dev/null || (echo "dev server failed"; cat /tmp/devfull.log; exit 1)
          curl -sf http://localhost:8000/api/config >/dev/null || (echo "terrain API failed"; cat /tmp/devfull.log; exit 1)
      - name: Run browser E2E
        env:
          CHANDRA_BROWSER_CI: '1'
          BASE_URL: http://localhost:5173/
        run: npm run test:browser
      - name: Run story tutorial E2E (personas A–E)
        env:
          CHANDRA_BROWSER_CI: '1'
          BASE_URL: http://localhost:5173/
        run: npm run test:story
      - name: Run scientific-export E2E (v1.10 personas A–E)
        env:
          CHANDRA_BROWSER_CI: '1'
          BASE_URL: http://localhost:5173/
        run: npm run test:exports
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: screenshots/
      - name: Upload dev-server log (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devfull-log
          path: /tmp/devfull.log
          if-no-files-found: warn
