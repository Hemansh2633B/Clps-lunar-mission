[package]
name = "chandra-geospatial-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
geotiff-reader = { version = "=0.11.0", features = ["cog-async"] }
proj4rs = { version = "=0.3.0", default-features = false }
proj4wkt = { version = "=0.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[lib]
path = "src/lib.rs"
